<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签 — My Blog</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #fff; --text: #333; --text-light: #666; --accent: #0066cc;
            --border: #e5e5e5; --code-bg: #f6f8fa;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e; --text: #e0e0e0; --text-light: #999; --accent: #66b3ff;
                --border: #333; --code-bg: #2a2a3e;
            }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.7; color: var(--text); background: var(--bg); }
        .wrapper { max-width: 720px; margin: 0 auto; padding: 0 20px; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .site-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 30px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
        .site-logo { font-size: 1.4rem; font-weight: 700; color: var(--text); }
        .nav-links { display: flex; align-items: center; gap: 20px; list-style: none; flex-wrap: wrap; }
        .nav-links a { font-size: 0.95rem; color: var(--text-light); }
        .nav-links a:hover { color: var(--accent); }
        .taxonomy-cloud h1 { margin-bottom: 24px; }
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 12px; }
        .tag-cloud a { padding: 4px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.95rem; transition: background 0.15s, border-color 0.15s; }
        .tag-cloud a:hover { background: var(--accent); color: #fff; border-color: var(--accent); text-decoration: none; }
        .site-footer { margin-top: 60px; padding: 24px 0; text-align: center; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-light); }
        @media (max-width: 600px) {
            .site-header { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="wrapper">

    <header class="site-header">

        <nav>

                <li><a href="tags.html" style="color:var(--accent);border-bottom:2px solid var(--accent);">标签</a></li>
                <li><a href="search.html">搜索</a></li>
                <li><a href="about.html">关于</a></li>
                <li>
                    <a href="https://github.com/your-username" target="_blank" title="GitHub">

                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="taxonomy-cloud">
            <h1>标签</h1>
            <div class="tag-cloud">
                <a href="post.html">#博客 (1)</a>
                <a href="post.html">#Hugo (1)</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 My Blog. Powered by Hugo.</p>

</div>
</body>
</html>
